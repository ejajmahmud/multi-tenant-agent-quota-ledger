[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-tenant-agent-quota-ledger"
version = "0.1.0"
description = "Enforces per-tenant token, tool-call, and spend quotas with atomic reserve, settle, and rollback accounting"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
multi-tenant-agent-quota-ledger = "multi_tenant_agent_quota_ledger.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["multi_tenant_agent_quota_ledger*"]
